<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',Arial,sans-serif;}
 body{width:412px;background:#060f13;}
 .phone{width:412px;min-height:892px;position:relative;overflow:hidden;
   background:radial-gradient(120% 60% at 25% -5%, #154150 0%, rgba(21,65,80,0) 55%),
     radial-gradient(90% 40% at 100% 8%, rgba(247,115,0,.18) 0%, rgba(247,115,0,0) 50%),#070f13;padding:18px 18px 28px;}
 .status{display:flex;justify-content:space-between;color:#9fb2ba;font-size:12px;font-weight:500;padding:2px 4px 16px;}
 .head{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
 .head img{width:30px;height:30px;}.head .name{color:#eaf2f4;font-size:18px;font-weight:600;}
 .head .gear{margin-left:auto;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#aebfc6;font-size:18px;}
 .glass{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);}
 .hero{padding:28px 20px 30px;text-align:center;margin-bottom:18px;}
 .hero .pre{color:#ff9a44;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;}
 .live{display:flex;justify-content:center;gap:46px;margin-bottom:18px;}
 .live .v{font-size:30px;font-weight:700;color:#eaf2f4;line-height:1;}
 .live .v.acc{color:#ff8a2a;}
 .live .k{font-size:11px;color:#8fa3ab;margin-top:4px;}
 .startwrap{position:relative;width:200px;height:200px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
 .ring{position:absolute;border-radius:50%;}
 .ring.r1{width:200px;height:200px;border:1px solid rgba(255,90,60,.18);}
 .ring.r2{width:166px;height:166px;border:1px solid rgba(255,90,60,.30);}
 .stopbtn{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ff7a5c, #e23b27 60%, #b52414);
   box-shadow:0 0 46px rgba(255,90,60,.5),0 10px 26px rgba(255,90,60,.3),inset 0 2px 6px rgba(255,255,255,.3);
   display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
 .stopbtn .sq{width:30px;height:30px;border-radius:6px;background:#fff;margin-bottom:6px;}
 .stopbtn .lbl{font-size:17px;font-weight:700;letter-spacing:1px;}
 .month{padding:18px 20px;margin-bottom:16px;}
 .month .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
 .month .top .m{color:#eaf2f4;font-size:15px;font-weight:600;}
 .month .top .pill{font-size:11px;font-weight:600;color:#9fd0bf;background:rgba(159,208,191,.12);padding:4px 10px;border-radius:20px;}
 .stats{display:flex;justify-content:space-between;}.stat{text-align:center;flex:1;}
 .stat .v{font-size:26px;font-weight:700;color:#eaf2f4;}.stat .v.acc{color:#ff8a2a;}.stat .k{font-size:11px;color:#8fa3ab;margin-top:3px;}
 .nav{display:flex;gap:12px;}.nav .item{flex:1;padding:18px 10px;text-align:center;}
 .nav .ic{width:42px;height:42px;border-radius:14px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(247,115,0,.10);border:1px solid rgba(247,115,0,.22);color:#ff9a44;}
 .nav .item:nth-child(2) .ic{background:rgba(143,205,221,.10);border-color:rgba(143,205,221,.22);color:#9fd6e6;}
 .nav .item:nth-child(3) .ic{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);color:#b9c8ce;}
 .nav .t{color:#cdd9de;font-size:12px;font-weight:500;}
</style></head><body><div class="phone">
